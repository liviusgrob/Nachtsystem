<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Nachtsystem – Diagnose</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<style>
  #diag {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a0606;
    color: #ff9a9a;
    padding: 20px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow: auto;
    z-index: 9999;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
  }
  #diag.visible { display: block; }
  #diag h2 { color: #ef4444; margin: 0 0 12px; font-size: 16px; }
  #diag pre { margin: 8px 0; line-height: 1.5; }
  #diag .ok { color: #7ee2a1; }
</style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="diag"></div>
  <noscript>Nachtsystem benötigt JavaScript.</noscript>

  <script>
    // Globaler Error-Handler VOR dem Modul-Load
    (function(){
      var diag = document.getElementById('diag');
      function show(title, msg) {
        diag.classList.add('visible');
        diag.innerHTML += '<h2>' + title + '</h2><pre>' + msg + '</pre>';
      }
      window.addEventListener('error', function(e){
        show('❌ Fehler', (e.message || 'unbekannt') + '\n\nDatei: ' + (e.filename || '?') + '\nZeile: ' + (e.lineno || '?'));
      }, true);
      window.addEventListener('unhandledrejection', function(e){
        var r = e.reason;
        show('❌ Promise-Fehler', (r && r.message) || String(r));
      });
      // Melde, wenn das Modul geladen wurde
      window.__nachtsystem_ok = function() {
        diag.innerHTML += '<pre class="ok">✓ app.js wurde geladen und ausgeführt.</pre>';
      };
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
